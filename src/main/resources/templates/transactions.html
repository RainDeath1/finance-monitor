
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Транзакции — Finance Monitor</title>

    <link rel="stylesheet" th:href="@{/css/finance.css}">
</head>
<body>

<main class="container">

    <h1>Finance Monitor</h1>

    <nav th:replace="~{fragments/navigation :: navigation}"></nav>

    <h2>Финансовые транзакции</h2>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}">
    </p>

    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
    </p>

    <section class="panel">
        <h3>Добавить операцию</h3>

        <form th:action="@{/transactions}"
              th:object="${transactionForm}"
              method="post">

            <div class="error"
                 th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="type">Тип операции</label>

                <select id="type" th:field="*{type}" required>
                    <option value="">Выберите тип</option>
                    <option value="INCOME">Доход</option>
                    <option value="EXPENSE">Расход</option>
                </select>

                <small class="error" th:errors="*{type}"></small>
            </div>

            <div class="field">
                <label for="categoryId">Категория</label>

                <select id="categoryId"
                        th:field="*{categoryId}" required>

                    <option value="">Выберите категорию</option>

                    <optgroup label="Доходы">
                        <option th:each="c : ${incomeCategories}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </optgroup>

                    <optgroup label="Расходы">
                        <option th:each="c : ${expenseCategories}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </optgroup>
                </select>

                <small class="error" th:errors="*{categoryId}"></small>
            </div>

            <div class="field">
                <label for="amount">Сумма (₸)</label>

                <input id="amount"
                       type="number"
                       min="0.01"
                       step="0.01"
                       th:field="*{amount}"
                       required>

                <small class="error" th:errors="*{amount}"></small>
            </div>

            <div class="field">
                <label for="transactionDate">Дата</label>

                <input id="transactionDate"
                       type="date"
                       th:field="*{transactionDate}"
                       required>

                <small class="error"
                       th:errors="*{transactionDate}"></small>
            </div>

            <div class="field">
                <label for="description">Описание</label>


                <textarea id="description"
                          th:field="*{description}"
                          maxlength="500"
                          rows="3"></textarea>

                <small class="error"
                       th:errors="*{description}"></small>
            </div>

            <button type="submit">Добавить транзакцию</button>
        </form>
    </section>

    <section class="panel">
        <h3>История операций</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Категория</th>
                    <th>Сумма</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="t : ${transactions}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.transactionDate}"></td>
                    <td th:text="${t.type}"></td>
                    <td th:text="${t.category.name}"></td>
                    <td th:text="|${t.amount} ₸|"></td>
                    <td th:text="${t.description}"></td>

                    <td class="actions-cell">

                        <a class="action-link"
                           th:href="@{/transactions/{id}/edit(id=${t.id})}">
                            Изменить
                        </a>

                        <form th:action="@{/transactions/{id}/delete(id=${t.id})}"
                              method="post"
                              class="inline-form"
                              onsubmit="return confirm('Удалить эту транзакцию?');">

                            <button type="submit" class="danger-button">
                                Удалить
                            </button>
                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="7">Транзакций пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

</body>
</html>
