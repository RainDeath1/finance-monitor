<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Вход — Finance Monitor</title>

    <link rel="stylesheet"
          th:href="@{/css/finance.css}">
</head>

<body>

<main class="container">

    <h1>Finance Monitor</h1>

    <section class="panel">

        <h2>Вход в систему</h2>

        <p>Авторизуйтесь для управления финансами.</p>

        <p th:if="${param.error}" style="color: red;">
            Неверный email или пароль.
        </p>

        <p th:if="${param.sessionExpired}"
           style="color: #dc2626;">
            Ваш сеанс завершён. Пожалуйста, войдите снова.
        </p>

        <p th:if="${param.registered}" style="color: green;">
            Регистрация прошла успешно!
            Теперь вы можете войти.
        </p>

        <form th:action="@{/login}" method="post">

            <div class="field">
                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        required>
            </div>

            <div class="field">
                <label for="password">Пароль</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        required>
            </div>

            <button type="submit">
                Войти
            </button>

        </form>

        <p>
            Нет аккаунта?
            <a th:href="@{/register}">
                Зарегистрироваться
            </a>
        </p>

    </section>

</main>

</body>
</html>
