
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Категории — Finance Monitor</title>

    <link rel="stylesheet" th:href="@{/css/finance.css}">
</head>
<body>

<main class="container">

    <h1>Finance Monitor</h1>

    <nav th:replace="~{fragments/navigation :: navigation}"></nav>

    <h2>Управление категориями</h2>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}"></p>


    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
    </p>


    <section class="panel">
        <h3>Добавить категорию</h3>

        <form th:action="@{/categories}"
              th:object="${categoryForm}"
              method="post">

            <div class="error"
                 th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}"></p>
            </div>

            <div class="field">
                <label for="name">Название категории</label>

                <input id="name"
                       type="text"
                       th:field="*{name}"
                       placeholder="Например: Кафе"
                       maxlength="100"
                       required>

                <small class="error"
                       th:errors="*{name}"></small>
            </div>

            <div class="field">
                <label for="type">Тип категории</label>

                <select id="type" th:field="*{type}" required>
                    <option value="">Выберите тип</option>
                    <option value="INCOME">Доход</option>
                    <option value="EXPENSE">Расход</option>
                </select>

                <small class="error"
                       th:errors="*{type}"></small>
            </div>

            <button type="submit">Добавить категорию</button>
        </form>
    </section>

    <section class="panel">
        <h3>Существующие категории</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Тип</th>
                    <th>Действия</th>
                </tr>
                </thead>


                <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.type.name() == 'INCOME' ? 'Доход' : 'Расход'}"></td>

                    <td class="actions-cell">
                        <a class="action-link"
                           th:href="@{/categories/{id}/edit(id=${c.id})}">
                            Изменить
                        </a>
                        <form th:action="@{/categories/{id}/delete(id=${c.id})}"
                              method="post"
                              class="inline-form"
                              onsubmit="return confirm('Удалить категорию?');">

                            <button type="submit" class="danger-button">
                                Удалить
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4">Категорий пока нет</td>
                </tr>
                </tbody>

            </table>
        </div>
    </section>

</main>

</body>
</html>
