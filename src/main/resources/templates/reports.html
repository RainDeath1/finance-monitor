<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Финансовые отчёты</title>

    <link rel="stylesheet"
          th:href="@{/css/finance.css}">
</head>
<body>

<main class="container">

    <h1>Finance Monitor</h1>

    <nav th:replace="~{fragments/navigation :: navigation}"></nav>

    <h2>Финансовые отчёты</h2>

    <section class="panel">

        <h3>Параметры отчёта</h3>

        <form th:action="@{/reports}" method="get">

            <div class="field">
                <label for="period">Период</label>

                <select id="period" name="period">

                    <option value="day"
                            th:selected="${period == 'day'}">
                        День
                    </option>

                    <option value="month"
                            th:selected="${period == 'month'}">
                        Месяц
                    </option>

                    <option value="quarter"
                            th:selected="${period == 'quarter'}">
                        Квартал
                    </option>

                    <option value="year"
                            th:selected="${period == 'year'}">
                        Год
                    </option>

                    <option value="custom"
                            th:selected="${period == 'custom'}">
                        Произвольный период
                    </option>

                </select>
            </div>

            <div class="field" id="report-year-field">
                <label for="year">Год</label>

                <input type="number"
                       id="year"
                       name="year"
                       min="1900"
                       max="2100"
                       th:value="${year}">
            </div>

            <div class="field" id="report-month-field">
                <label for="month">Месяц</label>

                <select id="month" name="month">

                    <option th:each="name, iter : ${monthNames}"
                            th:value="${iter.count}"
                            th:text="${name}"
                            th:selected="${iter.count == month}">
                    </option>

                </select>
            </div>

            <div class="field" id="report-quarter-field">
                <label for="quarter">Квартал</label>

                <select id="quarter" name="quarter">

                    <option value="1"
                            th:selected="${quarter == 1}">
                        I квартал
                    </option>

                    <option value="2"
                            th:selected="${quarter == 2}">
                        II квартал
                    </option>

                    <option value="3"
                            th:selected="${quarter == 3}">
                        III квартал
                    </option>

                    <option value="4"
                            th:selected="${quarter == 4}">
                        IV квартал
                    </option>

                </select>
            </div>

            <div class="field" id="report-day-field">
                <label for="day">Дата</label>

                <input type="date"
                       id="day"
                       name="day"
                       th:value="${day}">
            </div>

            <div class="field" id="report-date-from-field">
                <label for="dateFrom">Дата начала</label>

                <input type="date"
                       id="dateFrom"
                       name="dateFrom"
                       th:value="${dateFrom}">
            </div>

            <div class="field" id="report-date-to-field">
                <label for="dateTo">Дата окончания</label>

                <input type="date"
                       id="dateTo"
                       name="dateTo"
                       th:value="${dateTo}">
            </div>

            <button type="submit"
                    name="generate"
                    value="true">
                Сформировать отчёт
            </button>

        </form>

    </section>

    <!-- Ошибки -->
    <section class="panel" th:if="${error != null}">
        <p class="error" th:text="${error}"></p>
    </section>

    <!-- Предварительный просмотр -->
    <section class="panel" th:if="${report != null}">

        <h2 th:text="${report.title()}">
            Финансовый отчёт
        </h2>

        <div class="cards">

            <div class="card">
                <h3>Доходы</h3>
                <p>
                    <span th:text="${summary.income()}">0</span> ₸
                </p>
            </div>

            <div class="card">
                <h3>Расходы</h3>
                <p>
                    <span th:text="${summary.expenses()}">0</span> ₸
                </p>
            </div>

            <div class="card">
                <h3>Баланс</h3>
                <p>
                    <span th:text="${summary.balance()}">0</span> ₸
                </p>
            </div>

        </div>

    </section>

</main>
<script th:src="@{/js/reports_filters.js}"></script>
</body>
</html>
