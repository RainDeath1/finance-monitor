
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/finance.css}">

    <title>Finance Monitor</title>

</head>
<body>
<main class="container">
<h1>Finance Monitor</h1>


<nav>
    <a th:href="@{/dashboard}">Дашборд</a>
    <a th:href="@{/transactions}">Транзакции</a>
    <a th:href="@{/categories}">Категории</a>
</nav>

<h2>Финансовый дашборд</h2>
    <form th:action="@{/dashboard}"
          method="get"
          class="panel dashboard-filters">

        <div class="field">
            <label for="period">Период</label>

            <select id="period" name="period">
                <option value="month"
                        th:selected="${period == 'month'}">
                    Месяц
                </option>

                <option value="quarter"
                        th:selected="${period == 'quarter'}">
                    Квартал
                </option>

                <option value="year"
                        th:selected="${period == 'year'}">
                    Год
                </option>
            </select>
        </div>

        <div class="field">
            <label for="year">Год</label>

            <input type="number"
                   id="year"
                   name="year"
                   min="1900"
                   max="2100"
                   th:value="${year}"
                   required>
        </div>

        <div class="field" id="month-field">
            <label for="month">Месяц</label>

            <select id="month" name="month">

                <option th:each="name, iter : ${monthNames}"
                        th:value="${iter.count}"
                        th:text="${name}"
                        th:selected="${iter.count == month}">
                </option>

            </select>
        </div>

        <div class="field" id="quarter-field">
            <label for="quarter">Квартал</label>

            <select id="quarter" name="quarter">

                <option value="1" th:selected="${quarter == 1}">
                    I квартал
                </option>

                <option value="2" th:selected="${quarter == 2}">
                    II квартал
                </option>

                <option value="3" th:selected="${quarter == 3}">
                    III квартал
                </option>

                <option value="4" th:selected="${quarter == 4}">
                    IV квартал
                </option>

            </select>
        </div>

        <div class="field">
            <button type="submit">
                Показать
            </button>
        </div>

    </form>
<div class="cards">
    <div class="card">
        <h3>Доходы</h3>
        <p><span th:text="${income}">0</span> ₸</p>
    </div>

    <div class="card">
        <h3>Расходы</h3>
        <p><span th:text="${expenses}">0</span> ₸</p>
    </div>

    <div class="card">
        <h3>Баланс</h3>
        <p><span th:text="${balance}">0</span> ₸</p>
    </div>
</div>
<section class="panel">

    <h2 th:text="${chartTitle}">
        Динамика доходов и расходов
    </h2>

    <div class="chart-container">
        <canvas id="monthlyChart"></canvas>
    </div>

    <noscript>
        Для отображения графика необходимо включить JavaScript.
    </noscript>

</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

<script th:inline="javascript">

    window.financeChartData = {
        labels: /*[[${chartLabels}]]*/ [],
        incomes: /*[[${monthlyIncomes}]]*/ [],
        expenses: /*[[${monthlyExpenses}]]*/ []
    };

</script>

<script th:src="@{/js/dashboard_chart.js}"></script>
<script th:src="@{/js/dashboard_filters.js}"></script>

</body>
</html>
