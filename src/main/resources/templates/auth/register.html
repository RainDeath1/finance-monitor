<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Finance Monitor</title>

    <link rel="stylesheet"
          th:href="@{/css/finance.css}">
</head>

<body>

<main class="container">

    <h1>Finance Monitor</h1>

    <section class="panel">

        <h2>Регистрация</h2>

        <p>Создайте аккаунт для управления финансами.</p>

        <form th:action="@{/register}"
              th:object="${form}"
              method="post">

            <div class="field">

                <label for="name">Имя</label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       maxlength="100"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">
                </p>

            </div>

            <div class="field">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>

            </div>

            <div class="field">

                <label for="password">Пароль</label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       minlength="8"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>

            </div>

            <div class="field">

                <label for="confirmPassword">
                    Подтвердите пароль
                </label>

                <input type="password"
                       id="confirmPassword"
                       th:field="*{confirmPassword}"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">
                </p>

            </div>

            <p class="error"
               th:if="${error != null}"
               th:text="${error}">
            </p>

            <button type="submit">
                Зарегистрироваться
            </button>

        </form>

        <p>
            Уже есть аккаунт?
            <a th:href="@{/login}">Войти</a>
        </p>

    </section>

</main>

</body>
</html>
