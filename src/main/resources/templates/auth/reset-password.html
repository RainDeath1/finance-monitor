<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Новый пароль — Finance Monitor</title>

    <link rel="stylesheet" th:href="@{/css/finance.css}">
</head>

<body>
<main class="container">

    <h1>Finance Monitor</h1>

    <section class="panel">

        <h2>Установка нового пароля</h2>

        <p>
            Укажите новый пароль для вашей
            учётной записи.
        </p>

        <p th:if="${error != null}"
           th:text="${error}"
           style="color: red;">
        </p>

        <form th:if="${token != null}"
              th:action="@{/reset-password}"
              method="post">

            <input
                    type="hidden"
                    name="token"
                    th:value="${token}"
            >

            <label for="password">
                Новый пароль
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
            >

            <br><br>

            <label for="confirmPassword">
                Повторите новый пароль
            </label>

            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
            >

            <br><br>

            <button type="submit">
                Сохранить новый пароль
            </button>

        </form>

        <p>
            <a th:href="@{/login}">
                ← Вернуться к авторизации
            </a>
        </p>

    </section>
</main>
</body>
</html>
